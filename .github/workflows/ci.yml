name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '*' ]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript output
        run: npm run build

      - name: Build action bundle
        run: npm run build:gh

      - name: Verify committed build artifacts
        run: git diff --exit-code -- lib/index.js dist/index.js
